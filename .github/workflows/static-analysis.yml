name: Static Analysis

on:
  workflow_call:

jobs:
  SpotBugs:
    runs-on: codebuild-CryptoToolsCI-linux-amazon-s3-encryption-client-java-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: 'maven'
      - name: Run SpotBugs
        run: mvn -B -ntp com.github.spotbugs:spotbugs-maven-plugin:check
        shell: bash
